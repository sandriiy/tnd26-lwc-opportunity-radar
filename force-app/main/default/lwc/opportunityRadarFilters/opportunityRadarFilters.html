<template>
    <div class="radar-filters">
        <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
            <div class="slds-col slds-shrink slds-grid slds-grid_vertical-align-center">
                <div class="filter-search-col">
                    <lightning-input
                        type="search"
                        label="Search"
                        variant="label-hidden"
                        placeholder="Search by deal or account..."
                        value={filters.search}
                        onchange={handleSearchChange}>
                    </lightning-input>
                </div>
                <div class="slds-grid slds-grid_vertical-align-center slds-m-left_medium">
                    <span class="filter-label slds-m-right_x-small">Risk</span>
                    <lightning-combobox
                        label="Risk"
                        variant="label-hidden"
                        value={filters.riskFilter}
                        options={riskOptions}
                        onchange={handleRiskFilterChange}>
                    </lightning-combobox>
                </div>
            </div>
            <div class="slds-col slds-shrink slds-grid slds-grid_vertical-align-center">
                <lightning-input
                    type="toggle"
                    label="Compact"
                    checked={filters.compactView}
                    onchange={handleCompactToggle}>
                </lightning-input>
            </div>
        </div>
    </div>
</template>
