<template>
    <div class="radar-header">
        <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-m-bottom_medium">
            <h1 class="header-title">Opportunity Radar</h1>
            <div class="slds-grid slds-grid_vertical-align-center">
                <span class="slds-text-body_small slds-text-color_weak slds-m-right_x-small" lwc:if={lastRefresh}>Last refreshed: {lastRefresh}</span>
                <template lwc:if={isSyncing}>
                    <span class="slds-badge slds-badge_lightest slds-m-right_x-small">Syncing...</span>
                </template>
                <template lwc:elseif={syncComplete}>
                    <span class="slds-badge slds-badge_success slds-m-right_x-small">Synced</span>
                </template>
                <lightning-button-icon
                    icon-name="utility:refresh"
                    alternative-text="Refresh"
                    title="Refresh"
                    variant="border-filled"
                    disabled={isLoading}
                    onclick={handleRefresh}
                ></lightning-button-icon>
                <lightning-button-icon
                    icon-name="utility:delete"
                    alternative-text="Hard Refresh (clear cache)"
                    title="Hard Refresh — clears local cache and reloads all data from Salesforce"
                    variant="border-filled"
                    disabled={isLoading}
                    onclick={handleHardRefresh}
                    class="slds-m-left_x-small"
                ></lightning-button-icon>
            </div>
        </div>
        <div class="header-metrics slds-grid slds-wrap">
            <div class="metric-pill metric-critical">
                <span class="metric-value">{criticalCount}</span>
                <span class="metric-label">Critical</span>
            </div>
            <div class="metric-pill metric-warning">
                <span class="metric-value">{warningCount}</span>
                <span class="metric-label">Warning</span>
            </div>
            <div class="metric-pill metric-healthy">
                <span class="metric-value">{healthyCount}</span>
                <span class="metric-label">Healthy</span>
            </div>
            <div class="metric-pill metric-pipeline">
                <span class="metric-value">{formattedPipeline}</span>
                <span class="metric-label">Open Pipeline</span>
            </div>
        </div>
    </div>
</template>
