<template>
    <div class="radar-page">
        <c-opportunity-radar-header></c-opportunity-radar-header>
        <c-opportunity-radar-filters></c-opportunity-radar-filters>

        <div class="radar-feed">
            <template lwc:if={isLoading}>
                <div class="feed-loading">
                    <lightning-spinner alternative-text="Loading opportunities" size="medium"></lightning-spinner>
                </div>
            </template>

            <template lwc:else>
                <template lwc:if={hasError}>
                    <div class="feed-error">
                        <p>{errorMessage}</p>
                    </div>
                </template>

                <template lwc:else>
                    <template lwc:if={hasOpportunities}>
                        <template for:each={visibleOpportunities} for:item="opp">
                            <c-opportunity-radar-card
                                key={opp.id}
                                opportunity={opp}
                            ></c-opportunity-radar-card>
                        </template>
                        <template lwc:if={showLoadMore}>
                            <div class="load-more-container">
                                <lightning-button
                                    label="Load More"
                                    disabled={isSyncing}
                                    onclick={handleLoadMore}
                                ></lightning-button>
                            </div>
                        </template>
                    </template>

                    <template lwc:else>
                        <div class="feed-empty">
                            <p>No opportunities match your current filters</p>
                        </div>
                    </template>
                </template>
            </template>
        </div>

        <template lwc:if={selectedOpportunity}>
            <c-opportunity-radar-panel></c-opportunity-radar-panel>
        </template>
    </div>
</template>
